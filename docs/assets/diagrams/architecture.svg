<svg xmlns="http://www.w3.org/2000/svg" width="960" height="456" viewBox="0 0 960 456" role="img" aria-labelledby="title desc">
  <title id="title">Codex Remote architecture</title>
  <desc id="desc">The Android App and every Agent connect to the Gateway. The Agent downloads official extensions from the VS Code Marketplace and runs a separate extension host, the official extension.js and a Codex or Claude Code backend for each workspace window.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 13px; font-weight: 600; }
    .t { font-size: 13px; }
    .c { font-size: 12px; }
    .n { font-size: 11px; }
  </style>

  <rect x="0.5" y="0.5" width="959" height="455" rx="16" fill="#ffffff" stroke="#e2e8f0"/>

  <!-- Android App -->
  <rect x="32" y="128" width="200" height="216" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="132" y="164" class="h" fill="#172554">Android App</text>
  </g>
  <g fill="#ffffff" stroke="#bfdbfe">
    <rect x="52" y="184" width="160" height="36" rx="8"/>
    <rect x="52" y="232" width="160" height="36" rx="8"/>
    <rect x="52" y="280" width="160" height="36" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1e3a8a">
    <text x="132" y="207" class="t">Official webview</text>
    <text x="132" y="255" class="t">Workspace windows</text>
    <text x="132" y="303" class="t">Files · Terminal</text>
  </g>

  <!-- VS Code Marketplace -->
  <rect x="352" y="40" width="200" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <g text-anchor="middle">
    <text x="452" y="65" class="s" fill="#334155">VS Code Marketplace</text>
    <text x="452" y="84" class="c" fill="#64748b">Official extension packages</text>
  </g>

  <!-- Gateway -->
  <rect x="352" y="164" width="200" height="144" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="452" y="204" class="h" fill="#334155">Gateway</text>
    <text x="452" y="232" class="t" fill="#475569">Token auth · Routing</text>
    <text x="452" y="254" class="t" fill="#475569">Port 6767</text>
    <text x="452" y="276" class="t" fill="#475569">No chat parsing</text>
  </g>

  <!-- Agent stack -->
  <rect x="680" y="84" width="264" height="320" rx="14" fill="#f8fafc" stroke="#cbd5e1"/>
  <rect x="672" y="76" width="264" height="320" rx="14" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="804" y="110" class="h" fill="#334155">Agent</text>
    <text x="804" y="130" class="c" fill="#64748b">Linux · Windows</text>
  </g>
  <rect x="698" y="154" width="224" height="164" rx="10" fill="#ccfbf1" stroke="#5eead4"/>
  <rect x="692" y="148" width="224" height="164" rx="10" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <g text-anchor="middle">
    <text x="804" y="172" class="s" fill="#134e4a">Each workspace window</text>
  </g>
  <g fill="#ffffff" stroke="#99f6e4">
    <rect x="708" y="184" width="192" height="32" rx="7"/>
    <rect x="708" y="224" width="192" height="32" rx="7"/>
    <rect x="708" y="264" width="192" height="32" rx="7"/>
  </g>
  <g text-anchor="middle" fill="#134e4a">
    <text x="804" y="205" class="c">VS Code API host</text>
    <text x="804" y="245" class="c">Official extension.js</text>
    <text x="804" y="285" class="c">Codex · Claude Code</text>
  </g>
  <rect x="692" y="332" width="224" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <g text-anchor="middle">
    <text x="804" y="355" class="t" fill="#475569">File · Terminal services</text>
    <text x="808" y="430" class="c" fill="#64748b">Multiple Agents per Gateway</text>
  </g>

  <!-- Connections: both clients dial the Gateway -->
  <g stroke="#64748b" stroke-width="1.5" fill="none">
    <line x1="236" y1="236" x2="348" y2="236" marker-end="url(#arrow)"/>
    <line x1="668" y1="236" x2="556" y2="236" marker-end="url(#arrow)"/>
    <path d="M556 68H612Q624 68 624 80V92Q624 104 636 104H668" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle">
    <text x="292" y="224" class="c" fill="#475569">HTTPS / WSS</text>
    <text x="612" y="224" class="c" fill="#475569">WSS</text>
    <text x="612" y="256" class="n" fill="#64748b">outbound</text>
    <text x="596" y="58" class="n" fill="#64748b">download</text>
  </g>
</svg>
