name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          package-manager-cache: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.402
      - run: npm ci
      - run: node scripts/package-windows.mjs
      - name: Verify Windows installer
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/windows/codex-remote-windows-x64.zip
            release/windows/codex-remote-windows-x64-setup.exe
            release/windows/SHA256SUMS
          if-no-files-found: error
  release:
    needs: windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Verify tag matches package version
        run: |
          package_version="$(node --print "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
      - run: npm run package:binaries -- --targets linux-x64,linux-arm64
      - name: Verify standalone WebSocket transport
        run: |
          node scripts/smoke-gateway-binary.mjs release/codex-remote-gateway-linux-x64
          node scripts/smoke-gateway-binary.mjs release/codex-remote-gateway-linux-x64 --no-compression
          tar -xzf release/codex-remote-agent-runtime-linux-x64.tar.gz -C release
          CODEX_REMOTE_TEST_AGENT_BINARY=release/codex-remote-agent-linux-x64 npm test --workspace server -- src/extension-host.integration.test.ts
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are required" >&2
            exit 1
          fi
          mkdir -p signing
          chmod 700 signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > signing/codex-remote-release.p12
          chmod 600 signing/codex-remote-release.p12
          {
            printf '%s\n' 'storeFile=codex-remote-release.p12'
            printf '%s\n' "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            printf '%s\n' 'keyAlias=codex-remote'
            printf '%s\n' "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
            printf '%s\n' 'storeType=PKCS12'
          } > signing/keystore.properties
          chmod 600 signing/keystore.properties
      - name: Build signed Android APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify and stage signed Android APK
        run: |
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" \
            | tee "$RUNNER_TEMP/apk-signature.txt"
          expected_cert_sha256="4199695a5669529f3052ff33b31e0410f27aa911a6ffd2bc6a9f06df2436cbeb"
          grep -Fx 'Verified using v2 scheme (APK Signature Scheme v2): true' \
            "$RUNNER_TEMP/apk-signature.txt"
          grep -Fx 'Number of signers: 1' "$RUNNER_TEMP/apk-signature.txt"
          grep -Fq 'certificate DN: CN=chensunlai' "$RUNNER_TEMP/apk-signature.txt"
          grep -Fq "certificate SHA-256 digest: $expected_cert_sha256" \
            "$RUNNER_TEMP/apk-signature.txt"
          cp "$apk" release/codex-remote-android.apk
          (cd release && sha256sum codex-remote-android.apk >> SHA256SUMS)
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows-release
      - name: Stage Windows packages
        run: |
          cp release/windows-release/*.zip release/windows-release/*.exe release/
          cat release/windows-release/SHA256SUMS >> release/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            release/codex-remote-agent-linux-x64 \
            release/codex-remote-agent-linux-arm64 \
            release/codex-remote-agent-runtime-linux-x64.tar.gz \
            release/codex-remote-agent-runtime-linux-arm64.tar.gz \
            release/codex-remote-gateway-linux-x64 \
            release/codex-remote-gateway-linux-arm64 \
            release/codex-remote-android.apk \
            release/codex-remote-windows-x64.zip \
            release/codex-remote-windows-x64-setup.exe \
            release/SHA256SUMS \
            --clobber
